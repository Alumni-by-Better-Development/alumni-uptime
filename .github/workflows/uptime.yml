name: Uptime Portal Alumni

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API /health (espera 401)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://api.portal.betteredtech.com.br/health || echo 000)
          echo "api.portal /health -> HTTP $code"
          if [ "$code" != "999" ]; then  # TESTE — reverter
            echo "::error::API fora do ar ou com resposta inesperada (HTTP $code, esperado 401)"
            exit 1
          fi

      - name: Web (espera 2xx/3xx)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://portal.betteredtech.com.br || echo 000)
          echo "portal -> HTTP $code"
          case "$code" in
            2*|3*) ;;
            *) echo "::error::Web fora do ar (HTTP $code)"; exit 1 ;;
          esac

      - name: Certificado da API (alerta com <14 dias de validade)
        run: |
          exp=$(echo | openssl s_client -connect api.portal.betteredtech.com.br:443 -servername api.portal.betteredtech.com.br 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          echo "cert expira em: $exp"
          exp_s=$(date -d "$exp" +%s)
          now_s=$(date +%s)
          days=$(( (exp_s - now_s) / 86400 ))
          echo "dias restantes: $days"
          if [ "$days" -lt 14 ]; then
            echo "::error::Certificado da API expira em $days dias - verificar renovacao no Fly (fly certs check)"
            exit 1
          fi

  # Abre UMA issue quando o monitor falha (com mencoes - notifica sem watch) e
  # nao duplica enquanto a queda durar. MENTIONS: adicionar o Schuarts quando
  # soubermos o handle.
  alert:
    runs-on: ubuntu-latest
    needs: check
    if: failure()
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      MENTIONS: '@brunogilferro @inok-riak'
    steps:
      - name: Abrir issue de incidente (se nao houver uma aberta)
        run: |
          gh label create incident --repo "$GITHUB_REPOSITORY" --color D73A4A --force >/dev/null 2>&1 || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label incident --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            stamp=$(date -u '+%d/%m %H:%M')
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            body=$(printf '%s - o monitor detectou falha (API /health, web ou certificado).\n\nRun: %s\n\nTriagem rapida: curl -s -o /dev/null -w "%%{http_code}" https://api.portal.betteredtech.com.br/health (esperado 401; 525 = certificado/Cloudflare -> fly certs check).' "$MENTIONS" "$run_url")
            gh issue create --repo "$GITHUB_REPOSITORY" --label incident --title "🔴 Portal Alumni fora do ar ($stamp UTC)" --body "$body"
          else
            echo 'issue de incidente ja aberta - sem duplicar'
          fi

  # Fecha a issue sozinho quando os checks voltam a passar.
  recover:
    runs-on: ubuntu-latest
    needs: check
    if: success()
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fechar issue de incidente aberta
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label incident --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            stamp=$(date -u '+%d/%m %H:%M')
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "✅ Monitor verde de novo - portal recuperado ($stamp UTC)."
          else
            echo 'nenhum incidente aberto'
          fi

  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat mensal (impede o GitHub de suspender o cron por inatividade)
        run: |
          last=$(git log -1 --format=%ct -- .heartbeat 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ $(( now - last )) -gt 2592000 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git config user.name 'uptime-bot'
            git config user.email 'actions@github.com'
            git add .heartbeat && git commit -m 'chore: heartbeat' && git push
          else
            echo 'heartbeat recente, nada a fazer'
          fi
